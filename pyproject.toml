[project]
name = "caltechdata"
description = "The Caltech institutional data repository"
readme = "README.md"
version = "14.0.6"
requires-python = ">= 3.12"

dependencies = [
  "invenio-app-rdm[opensearch2, s3]~=14.0.6",
  "invenio-saml",
  "invenio-s3",
  "invenio-rdm-records",
  "setuptools<82",
  "sentry-sdk>=1.45,<2.0.0",
  "python-dotenv>=0.21.0",
  "granian",
  "lxml-html-clean>=0.1.1",
]

tests = [
    "pytest-invenio>=3.0.0,<4.0.0",
]

[dependency-groups]
dev = [
    "flask-debugtoolbar>=0.16.0",
    "pytest-invenio>=3.0.0,<4.0.0",
]

[tool.uv]
no-binary-package = [
    "lxml",
    "xmlsec"
]
