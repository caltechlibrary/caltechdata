# TLS protocol and session settings, for every --tls choice. nginx-deploy.bash
# installs this file as /etc/nginx/snippets/ssl-params.conf, which the site
# config includes next to snippets/caltechdata-tls.conf. The DH parameters it
# names are written by cloud-init; the script requires them and stops if they
# are missing.
#
# Same directives as caltechauthors' file. This file deliberately carries no
# add_header: the application owns the security headers (Talisman, via
# APP_DEFAULT_SECURE_HEADERS in invenio.cfg), and nginx's add_header appends
# rather than replaces, so an X-Frame-Options here as well as the
# application's leaves two conflicting values, which browsers treat as one
# invalid directive and refuse to frame the document (caltechauthors DR-0005).
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers on;
ssl_dhparam /etc/nginx/dhparam.pem;
ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;
ssl_ecdh_curve secp384r1;
ssl_session_cache shared:SSL:10m;
ssl_session_tickets off;
ssl_stapling off;
ssl_stapling_verify off;
resolver 127.0.0.53 valid=300s;
resolver_timeout 5s;
