# TLS certificate for --tls letsencrypt. nginx-deploy.bash renders this file (it
# replaces CERT_NAME, written between @ signs below, with the Let's Encrypt
# lineage name, by default the server name) and installs it as
# /etc/nginx/snippets/caltechdata-tls.conf, which the site config includes.
#
# Obtain the certificate with "certbot certonly", which does not edit nginx
# configuration; never run "certbot --nginx" on a host this script manages, it
# would insert certificate lines into the rendered site file, and the next
# deployment would remove or duplicate them. Renewals replace the files under
# /etc/letsencrypt/live/ and reload nginx; they do not touch this file.
ssl_certificate /etc/letsencrypt/live/@CERT_NAME@/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/@CERT_NAME@/privkey.pem;
