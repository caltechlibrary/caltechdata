# TLS certificate for --tls self-signed (test instances). nginx-deploy.bash
# installs this file as /etc/nginx/snippets/caltechdata-tls.conf, which the
# site config includes. The self-signed pair itself comes from snippets/self-signed.conf,
# which cloud-init writes along with the certificate under /etc/ssl; the script
# requires that file and stops if it is missing.
include snippets/self-signed.conf;
