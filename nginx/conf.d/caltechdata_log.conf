# Extended access-log format for identifying automated traffic, as on CaltechAUTHORS.
#
# Linked by nginx-deploy.bash as /etc/nginx/conf.d/caltechdata_log.conf (caltechdata
# DR-0007). This file only DEFINES the format. conf.d is included before sites-enabled,
# so the format exists when the site config uses it; each server block of the site config
# (ports 80 and 443) sets "access_log ... caltechdata_bots;" itself, and the packaged
# /etc/nginx/nginx.conf is left as the package ships it. Production includes the same
# format from a hand-edited nginx.conf, as /etc/nginx/caltechdata_log.conf, in place of the
# stock access_log line (survey 2026-10-29). The replacement host is built from this tree
# and never edited by hand, so the format ships here; on a host that still has the old
# top-level file the format would be defined twice, and the staged nginx -t refuses
# before anything changes.
# Do not add an access_log here: at http level it would be a second log of every request,
# in the same file, in a different layout from the package's own.
# Rollback: nginx-deploy.bash rollback.
#
# The format is production's own, unchanged, and logagent's check found all 19 of its
# fields (2026-10-23). CaltechAUTHORS' copy has one more, cache="$upstream_cache_status",
# for its IIIF cache; CaltechDATA has no such cache.
#
# The first nine fields are the stock "combined" format, so existing awk/grep over
# $1 (client), $4 (time), $7 (path), $9 (status) and the quoted user agent still work.
#   rt / urt     total request time and upstream (the application) response time
#   cf_ray       Cloudflare request id; "-" means the request did not come through Cloudflare
#   cf_country   Cloudflare's country code for the client
#   peer         the connecting address before real_ip rewrote it
#   lang, ch_ua, ch_plat   Accept-Language and client-hint headers
#   bot_score, ja3, ja4    Cloudflare bot score and TLS fingerprints (empty unless the plan sends them)

log_format caltechdata_bots
    '$remote_addr - $remote_user [$time_local] "$request" '
    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
    'rt=$request_time urt="$upstream_response_time" '
    'cf_ray="$http_cf_ray" cf_country="$http_cf_ipcountry" '
    'peer=$realip_remote_addr '
    'lang="$http_accept_language" ch_ua="$http_sec_ch_ua" '
    'ch_plat="$http_sec_ch_ua_platform" '
    'bot_score="$http_cf_bot_score" ja3="$http_cf_ja3_hash" ja4="$http_cf_ja4"';
