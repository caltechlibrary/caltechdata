# TEMPLATE. nginx-deploy.bash renders this file and installs it as
# /etc/nginx/sites-available/<site-name>.conf, linked from sites-enabled. It
# replaces two names written between @ signs: SERVER_NAME (the host's name, for
# server_name; "_" is a catch-all) and REPO_DIR (the checkout: the redirect map
# and the static files).
# TLS is not in this file: snippets/caltechdata-tls.conf holds the certificate
# pair, and the script writes it from nginx/tls/ (--tls letsencrypt|self-signed).
# Never run "certbot --nginx" on a host this script manages: it inserts lines
# into this file and the next deployment removes or duplicates them.
#
# TIND record numbers to RDM identifiers (/records/204 -> /records/qrrzg-tr757,
# about 20,000 entries). CaltechDATA was TIND before it was RDM, and old numeric
# URLs are still cited. This file only defines the $redirect_uri map, so it has
# to be included at http level, outside any server block. It sets map_hash_*
# first, which nginx requires before any map block. Absolute path because the
# map lives in the repo checkout rather than under /etc/nginx; nginx's master
# reads its config as root at startup, so the clone's ownership is fine.
include @REPO_DIR@/nginx/redirect-map.conf;

# nginx 1.24's mime.types (Ubuntu) has no entry for .mjs, so pdf.js's ES modules
# under /static/js/pdfjs fall through to "default_type application/octet-stream"
# and browsers refuse to load them as modules (caltechauthors DR-0007; the
# previewer is used here too). Placed at http level deliberately: repeated
# types blocks in one context ADD to the map, while a types block in a server
# or location context REPLACES the inherited map and would serve every other
# extension as octet-stream.
types {
    text/javascript mjs;
}

server {
  server_name @SERVER_NAME@;
  listen 80;
  listen [::]:80;
  return 301 https://$host$request_uri;
}

server {
  server_name @SERVER_NAME@;
  include snippets/caltechdata-tls.conf;
  include snippets/ssl-params.conf;
  add_header Strict-Transport-Security "max-age=15768000"; # 6 months
  # Request ID tracing (allows end-to-end tracking of requests for better
  # troubleshooting)
  add_header X-Request-ID $request_id;
  listen 443 ssl;
  listen [::]:443 ssl;

  # The request body is sent to the proxied server immediately as it is
  # received, and nothing is buffered, so a large upload streams through.
  proxy_request_buffering off;
  proxy_buffering off;
  # HTTP/1.1 to the application, in order to not use the buffer in case of
  # chunked transfer encoding
  proxy_http_version 1.1;

  # Proxying to the application server (Granian, plain HTTP; this was uWSGI's
  # uwsgi protocol before the Granian move).
  ## UI server
  location / {
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Pass request id to the ui server
    proxy_set_header X-Request-ID $request_id;
    # X-Session-ID / X-User-ID is read by nginx and included in the logs,
    # however we don't want to expose them to clients so we are hiding them.
    proxy_hide_header X-Session-ID;
    proxy_hide_header X-User-ID;
    # Max upload size (except for files) is set to 100mb as default.
    client_max_body_size 100m;
  }
  ## Most API
  # No trailing slash on proxy_pass: nginx forwards /api/... unmodified and
  # Granian's --url-path-prefix /api in rdm_rest.service strips it. The two are
  # a matched pair (caltechauthors DR-0007): change one without the other and
  # every /api request breaks.
  location /api {
    proxy_pass http://127.0.0.1:5001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Pass request id to the api server
    proxy_set_header X-Request-ID $request_id;
    proxy_hide_header X-Session-ID;
    proxy_hide_header X-User-ID;
    # Max upload size (except for files) is set to 100mb as default.
    client_max_body_size 100m;
  }
  ## API files
  # Another location is defined in order to allow large file uploads in the files
  # API without exposing the other parts of the application to receive huge
  # request bodies. Optional trailing /<part-number> and slash match the
  # multipart file-content requests.
  location ~ ^/api/records/.+/draft/files/.+/content(?:/[0-9]+)?/?$ {
    gzip off;
    proxy_pass http://127.0.0.1:5001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Pass request id to api server
    proxy_set_header X-Request-ID $request_id;
    proxy_hide_header X-Session-ID;
    proxy_hide_header X-User-ID;
    # Max upload size for files is set to 500GB (configure as needed).
    client_max_body_size 500G;
    # uWSGI's 120 s socket timeouts no longer apply; these do. A starting
    # point, to be set from the Stage 1 large-upload test (caltechdata DR-0001).
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
  # Static content is served directly by nginx and not the application server
  # (the path reflects uv's venv layout, not the old Pipenv virtualenvs path).
  location /static {
    alias @REPO_DIR@/.venv/var/instance/static;
    autoindex off;
    # A location-level add_header REPLACES every inherited one rather than
    # adding to it, so the two server-level headers are restated here or they
    # are silently lost for /static.
    add_header Strict-Transport-Security "max-age=15768000";
    add_header X-Request-ID $request_id;
  }

  # Serve the TIND-number redirects from the $redirect_uri map included at the
  # top of this file. Server level, so it is evaluated before a location is
  # chosen, and placed after the locations. The map yields an empty string for
  # any URI it does not know and an empty value is falsy, so this is a no-op for
  # every current URL.
  if ($redirect_uri) {
    return 301 $redirect_uri;
  }
}
